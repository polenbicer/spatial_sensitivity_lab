name: Fetch extra sources
on:
  push:
    branches: ['data/fetch-sources']
    paths: ['scripts/extra_sources.txt', 'scripts/fetch_extra_sources.py', 'scripts/crawl_mdq_indicators.py', '.github/workflows/fetch-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/fetch_extra_sources.py
      - run: python scripts/crawl_mdq_indicators.py
        timeout-minutes: 40
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/extra
          git commit -m "Fetch extra sources [skip ci]" || echo "nothing to commit"
          git push
