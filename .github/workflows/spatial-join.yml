name: Amsterdam spatial join
on:
  push:
    branches: ['feat/spatial-join']
    paths: ['scripts/spatial_join_amsterdam.py', '.github/workflows/spatial-join.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely==2.0.6
      - run: python scripts/spatial_join_amsterdam.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/extra
          git commit -m "Amsterdam buurt-wijk spatial join [skip ci]" || echo "nothing to commit"
          git push
